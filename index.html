<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Homepages</title>
</head>
<body>
    <header>
        <h1>Stripmuren in Brussel</h1>
    </header>
    <main>
        <p id="status" class="status">Laden...</p>
        <div id="kaart" class="kaart"></div>
        <section id="controls" class="controls">
            <input type="search" id="zoek" placeholder="Zoek op naam, tekenaar of adres">
            <select id="filter-wijk"><option value="">Alle wijken</option></select>
            <select id="filter-gemeente"><option value="">Alle gemeenten</option></select>
            <select id="filter-postcode"><option value="">Alle postcodes</option></select>
            <select id="sorteer">
                <option value="naam">Sorteer op naam</option>
                <option value="jaar">Sorteer op jaar</option>
            </select>
            <select id="richting">
                <option value="oplopend">Oplopend</option>
                <option value="aflopend">Aflopend</option>
            </select>
        </section>
        <section id="app" class="app"></section>
    </main>
    <div id="detail" class="detail hidden"></div>
    <footer><p>Dynamic-web/Ilias Ben-Fodda</p></footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/map.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
